name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack source if repository contains only the ZIP
        shell: bash
        run: |
          if [ ! -f settings.gradle ]; then
            test -f Tenda-SP3-QuickSwitch-Source.zip || { echo 'Upload Tenda-SP3-QuickSwitch-Source.zip first' >&2; exit 1; }
            unzip -q -o Tenda-SP3-QuickSwitch-Source.zip -d .
          fi
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tenda-SP3-QuickSwitch-APK
          path: app/build/outputs/apk/debug/app-debug.apk
